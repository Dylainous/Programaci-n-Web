<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edison's Computer Store — Customers</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">🖥️</div>
    <div>
      <h1>Edison's Computer Store</h1>
      <p>Customer Management Dashboard</p>
    </div>
  </header>

  <main>
    <!-- Controls -->
    <div class="controls">
      <div class="search-wrapper">
        <!-- Search icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search by name, ID or age…"
          oninput="filterTable()"
        />
      </div>
      <div class="count-badge" id="countBadge">Loading…</div>
    </div>

    <!-- Table card -->
    <div class="table-card">
      <div id="statusMsg">⏳ Loading customers…</div>

      <table id="customerTable" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Money Spent ($)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>

      <div id="noResults">🔍 No customers match your search.</div>

      <div class="total-bar" id="totalBar" style="display:none;">
        <span>Grand Total — all customers</span>
        <span class="total-amount" id="grandTotal">$0.00</span>
      </div>
    </div>
  </main>

  <script>
    let allRows = [];   // all <tr> elements
    let grandTotal = 0;

    // ── Fetch data from the API ──────────────────────────────────────────────
    async function loadCustomers() {
      try {
        const res = await fetch("/computerstore/customers");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        grandTotal = data.grandTotal;
        renderTable(data.customers);
      } catch (err) {
        const statusEl = document.getElementById("statusMsg");
        statusEl.textContent = `❌ Failed to load customers: ${err.message}`;
        statusEl.classList.add("error");
      }
    }

    // ── Build the table rows ─────────────────────────────────────────────────
    function renderTable(customers) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      allRows = [];

      customers.forEach((c) => {
        const tr = document.createElement("tr");
        tr.dataset.search =
          `${c.number} ${c.id} ${c.name} ${c.age}`.toLowerCase();

        tr.innerHTML = `
          <td class="num-cell">${c.number}</td>
          <td class="id-cell">${c.id ?? "—"}</td>
          <td class="name-cell">${escHtml(c.name)}</td>
          <td class="age-cell">${c.age}</td>
          <td>$${c.moneySpent.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
        allRows.push(tr);
      });

      // Show table and totals
      document.getElementById("statusMsg").style.display = "none";
      document.getElementById("customerTable").style.display = "table";
      document.getElementById("totalBar").style.display = "flex";
      document.getElementById("grandTotal").textContent =
        `$${grandTotal.toFixed(2)}`;
      updateCount(customers.length, customers.length);
    }

    // ── Live search / filter ─────────────────────────────────────────────────
    function filterTable() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let visible = 0;

      allRows.forEach((tr) => {
        const match = !query || tr.dataset.search.includes(query);
        tr.style.display = match ? "" : "none";
        if (match) visible++;
      });

      document.getElementById("noResults").style.display =
        visible === 0 ? "block" : "none";

      updateCount(visible, allRows.length);
    }

    function updateCount(visible, total) {
      document.getElementById("countBadge").textContent =
        visible === total
          ? `${total} customer${total !== 1 ? "s" : ""}`
          : `${visible} of ${total} customers`;
    }

    // ── Utility ──────────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    loadCustomers();
  </script>
</body>
</html>
