<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edison's Computer Store — Customers</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
      color: #fff;
      padding: 28px 40px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    header .logo {
      font-size: 2rem;
    }
    header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header p {
      font-size: 0.85rem;
      color: #a0aec0;
      margin-top: 2px;
    }

    /* ── Main container ──────────────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* ── Controls bar ────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 14px;
      flex-wrap: wrap;
    }
    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 400px;
    }
    .search-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #718096;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      transition: border-color 0.2s;
      outline: none;
    }
    #searchInput:focus { border-color: #4299e1; }

    .count-badge {
      background: #ebf8ff;
      color: #2b6cb0;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #bee3f8;
      white-space: nowrap;
    }

    /* ── Table card ──────────────────────────────────────────── */
    .table-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background: linear-gradient(135deg, #2b6cb0 0%, #3182ce 100%);
      color: #fff;
    }
    thead th {
      padding: 14px 18px;
      text-align: left;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    thead th:last-child { text-align: right; }

    tbody tr {
      border-bottom: 1px solid #edf2f7;
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #ebf8ff; }

    tbody td {
      padding: 13px 18px;
      font-size: 0.95rem;
    }
    tbody td:last-child {
      text-align: right;
      font-weight: 600;
      color: #276749;
    }

    .num-cell {
      color: #a0aec0;
      font-size: 0.85rem;
      font-weight: 600;
      width: 50px;
    }
    .id-cell {
      font-family: monospace;
      font-size: 0.88rem;
      color: #718096;
    }
    .name-cell { font-weight: 600; }
    .age-cell  { color: #4a5568; }

    /* ── No results ──────────────────────────────────────────── */
    #noResults {
      display: none;
      padding: 48px;
      text-align: center;
      color: #a0aec0;
      font-size: 1rem;
    }

    /* ── Footer / grand total ────────────────────────────────── */
    .total-bar {
      background: #1a202c;
      color: #fff;
      padding: 18px 28px;
      border-radius: 0 0 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .total-bar span {
      font-size: 0.9rem;
      color: #a0aec0;
    }
    .total-bar .total-amount {
      font-size: 1.3rem;
      font-weight: 800;
      color: #68d391;
      letter-spacing: 0.5px;
    }

    /* ── Loading / error states ──────────────────────────────── */
    #statusMsg {
      text-align: center;
      padding: 60px 20px;
      font-size: 1rem;
      color: #718096;
    }
    #statusMsg.error { color: #c53030; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🖥️</div>
    <div>
      <h1>Edison's Computer Store</h1>
      <p>Customer Management Dashboard</p>
    </div>
  </header>

  <main>
    <!-- Controls -->
    <div class="controls">
      <div class="search-wrapper">
        <!-- Search icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search by name, ID or age…"
          oninput="filterTable()"
        />
      </div>
      <div class="count-badge" id="countBadge">Loading…</div>
    </div>

    <!-- Table card -->
    <div class="table-card">
      <div id="statusMsg">⏳ Loading customers…</div>

      <table id="customerTable" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Money Spent ($)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>

      <div id="noResults">🔍 No customers match your search.</div>

      <div class="total-bar" id="totalBar" style="display:none;">
        <span>Grand Total — all customers</span>
        <span class="total-amount" id="grandTotal">$0.00</span>
      </div>
    </div>
  </main>

  <script>
    let allRows = [];   // all <tr> elements
    let grandTotal = 0;

    // ── Fetch data from the API ──────────────────────────────────────────────
    async function loadCustomers() {
      try {
        const res = await fetch("/computerstore/customers");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        grandTotal = data.grandTotal;
        renderTable(data.customers);
      } catch (err) {
        const statusEl = document.getElementById("statusMsg");
        statusEl.textContent = `❌ Failed to load customers: ${err.message}`;
        statusEl.classList.add("error");
      }
    }

    // ── Build the table rows ─────────────────────────────────────────────────
    function renderTable(customers) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      allRows = [];

      customers.forEach((c) => {
        const tr = document.createElement("tr");
        tr.dataset.search =
          `${c.number} ${c.id} ${c.name} ${c.age}`.toLowerCase();

        tr.innerHTML = `
          <td class="num-cell">${c.number}</td>
          <td class="id-cell">${c.id ?? "—"}</td>
          <td class="name-cell">${escHtml(c.name)}</td>
          <td class="age-cell">${c.age}</td>
          <td>$${c.moneySpent.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
        allRows.push(tr);
      });

      // Show table and totals
      document.getElementById("statusMsg").style.display = "none";
      document.getElementById("customerTable").style.display = "table";
      document.getElementById("totalBar").style.display = "flex";
      document.getElementById("grandTotal").textContent =
        `$${grandTotal.toFixed(2)}`;
      updateCount(customers.length, customers.length);
    }

    // ── Live search / filter ─────────────────────────────────────────────────
    function filterTable() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let visible = 0;

      allRows.forEach((tr) => {
        const match = !query || tr.dataset.search.includes(query);
        tr.style.display = match ? "" : "none";
        if (match) visible++;
      });

      document.getElementById("noResults").style.display =
        visible === 0 ? "block" : "none";

      updateCount(visible, allRows.length);
    }

    function updateCount(visible, total) {
      document.getElementById("countBadge").textContent =
        visible === total
          ? `${total} customer${total !== 1 ? "s" : ""}`
          : `${visible} of ${total} customers`;
    }

    // ── Utility ──────────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    loadCustomers();
  </script>
</body>
</html>
